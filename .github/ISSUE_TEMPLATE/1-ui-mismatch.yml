name: Screen doesn't match the app
description: A screen in the recreation looks or behaves differently from the real Claude app.
title: '[Mismatch] '
labels:
  - parity
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the recreation faithful. Comparisons only work like for like, so please capture the
        real app and the recreation on the same device size, appearance and text size.
  - type: input
    id: screen
    attributes:
      label: Screen
      description: Where in the app, for example "Settings → Privacy". Add the demo's `--screen` name if there
        is one.
      placeholder: Settings → Privacy (settingsPrivacy)
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: What's different
      description: Spacing, colors, text, icons, motion, or behavior after a tap.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Starting screen, taps/holds, keyboard state, expected result and actual result. For motion,
        include a short recording and what timing looks wrong.
    validations:
      required: true
  - type: upload
    id: reference
    attributes:
      label: The real app
      description: A screenshot or short screen recording of the real Claude app.
    validations:
      required: true
      accept: .png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm
  - type: upload
    id: recreation
    attributes:
      label: The recreation
      description: The same screen in this project, if you can run it.
    validations:
      required: false
      accept: .png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm
  - type: input
    id: app-version
    attributes:
      label: Claude app version
      description: Shown in Claude → Settings → the ⓘ menu.
      placeholder: 1.261002.20 (37091698851)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15 Pro, iOS 27.0
      description: Record the reference phone and demo simulator separately, including iOS build numbers. Use
        unknown for unverified metadata.
    validations:
      required: true
  - type: dropdown
    id: appearance
    attributes:
      label: Appearance
      options:
        - Light
        - Dark
        - Both
    validations:
      required: true
  - type: input
    id: capture-configuration
    attributes:
      label: Capture date and display settings
      description: Date observed; locale; light/dark; text size; display zoom; keyboard shown/hidden; relevant
        accessibility settings. Unknown is acceptable.
    validations:
      required: true
  - type: input
    id: demo-version
    attributes:
      label: Demo commit and Xcode version/build
      description: If you ran the skeleton, paste its commit or release and xcodebuild -version output. Otherwise
        write not run.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal information (names, email addresses, conversations, photos) from the uploads.
          required: true
